<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sender+ Help Form</title>
  </head>
  <body>
    <form name="senderplus-help" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="senderplus-help" />
      <input type="text" name="first-name" />
      <input type="text" name="middle-name" />
      <input type="text" name="surname" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="topic">
        <option value="Sending a package">Sending a package</option>
        <option value="Tracking">Tracking</option>
        <option value="Coverage">Coverage</option>
        <option value="Student delivery">Student delivery</option>
        <option value="Business delivery">Business delivery</option>
        <option value="Partnership / business inquiry">Partnership / business inquiry</option>
        <option value="Other">Other</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
